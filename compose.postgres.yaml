# Optional bundled PostgreSQL. Omit this file to use default encrypted SQLite.
services:
  app:
    environment:
      DATABASE_URL: postgresql://drg:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in .env}@postgres:5432/drg
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: drg
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate POSTGRES_ADMIN_PASSWORD in .env}
      DRG_APP_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in .env}
      DRG_APP_SCHEMA: ${DATABASE_SCHEMA:-drg}
    volumes:
      - drg-postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-drg.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d drg]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  drg-postgres:
    name: ${DRG_SPACE_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-drg-space}_drg-postgres}
    external: ${DRG_SPACE_EXTERNAL_VOLUMES:-false}
